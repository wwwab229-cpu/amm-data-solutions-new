name: Website build and technical checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build production assets
        run: npm run build
      - name: Verify required runtime assets and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/assets/tailwind.min.css
          test -s dist/assets/homepage.css
          test -s dist/assets/homepage.js
          test -s dist/index.html
          node --check assets/homepage.js
          ! grep -q 'cdn.tailwindcss.com' index.html
          echo "Build assets and homepage JavaScript syntax validated."
