<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AMM Data Solutions</title>
  <desc id="desc">AMM Data Solutions logo with magenta outline lettering and a yellow accent bar on black background.</desc>
  <rect width="1600" height="900" fill="#000000"/>

  <g transform="translate(170 80)">
    <rect x="170" y="235" width="430" height="58" rx="12" fill="#F6CF2A"/>

    <text
      x="0"
      y="350"
      font-family="Arial, Helvetica, sans-serif"
      font-size="440"
      font-weight="900"
      letter-spacing="-18"
      fill="none"
      stroke="#FF4CE2"
      stroke-width="14"
      paint-order="stroke fill"
      style="font-stretch:condensed;"
    >AMM</text>

    <text
      x="10"
      y="640"
      font-family="Arial, Helvetica, sans-serif"
      font-size="220"
      font-weight="900"
      letter-spacing="-8"
      fill="none"
      stroke="#FF4CE2"
      stroke-width="10"
      paint-order="stroke fill"
    >Data Solutions</text>
  </g>
</svg>
